packages:
  - '.'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma

overrides:
  brace-expansion: '>=5.0.12'
  js-yaml: '>=4.3.2'
  deepmerge-ts: '>=8.0.0'
  shell-quote: '>=1.11.0'
  follow-redirects: '>=1.16.1'